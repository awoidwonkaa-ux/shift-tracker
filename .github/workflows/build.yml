name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor Core and Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add and Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # 🔥 ВОТ ЭТОТ ШАГ ИСПРАВЛЯЕТ ОШИБКУ С JAVA 21 🔥
      - name: Force Java 17 Compatibility
        run: |
          # Указываем Gradle использовать 17 версию Java для компиляции
          sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/g' android/variables.gradle || true
          sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/g' android/variables.gradle || true
          
          # Принудительно задаем sourceCompatibility и targetCompatibility
          echo "android { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } }" >> android/app/build.gradle
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { android { compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 } } } } }" >> android/build.gradle

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          # Явно указываем Java Home на всякий случай
          export JAVA_HOME=$JAVA_HOME_21_X64
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error