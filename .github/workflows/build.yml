name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v5  # Обновил до v5, как требует GitHub на скриншоте
        with:
          java-version: '17'
          distribution: 'temurin'
          # Убрали cache: 'gradle', так как папки android/ еще не существует на этом шаге!

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor Core and Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add and Sync Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # Добавил официальный экшен для кэширования Gradle ПЕРЕД сборкой. 
      # Теперь папка android/ уже существует, и кэш будет работать корректно.
      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error